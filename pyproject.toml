[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acra"
version = "0.1.0"
description = "AI Code Review Assistant - 可定位、可验证、数量克制的行级代码审查机器人"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # [crypto] 是 RS256 签名的硬依赖（App JWT）：裸 pyjwt 装不出 cryptography，
    # 干净环境（CI/部署）里 App 发布路径会直接挂——实测踩过。
    "pyjwt[crypto]>=2.8",
    "typer>=0.13",
    "sqlalchemy>=2.0",
    "jsonschema>=4.23",
    "prometheus-client>=0.21",
    # 必须与 grammar 的 ABI 对齐：tree-sitter 0.26 配 tree-sitter-java 0.23.x 会在
    # 20KB 以上的源码上读越界内存，进程直接 access violation（无法用 try/except 兜住）。
    # 见 README「已知坑」一节。
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]
postgres = ["psycopg[binary]>=3.2"]
# L3 向量检索的可选依赖（ADR 0006 小仓库策略）。
# torch 请走 CPU 专用源安装：pip install torch -f https://mirrors.aliyun.com/pytorch-wheels/cpu/
l3-vector = [
    "torch>=2.0",
    "sentence-transformers>=3.0",
]
redis = ["redis>=5.2"]

[project.scripts]
acra = "acra.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/acra"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
